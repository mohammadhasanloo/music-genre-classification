[project]
name = "music-genre-classification"
version = "1.0.0"
description = "Genre prediction from audio features with KNN, decision tree and random forest"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genre = "genre.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genre*"]
